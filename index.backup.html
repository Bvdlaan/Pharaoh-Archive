<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A browsable chronology of ancient Egyptian rulers, arranged by historical period and dynasty.">
  <title>Ancient Egyptian Rulers</title>
  <style>
    :root { --paper:#f4e7bf; --light:#fffaf0; --ink:#30271e; --blue:#17355f; --deep:#0b2241; --gold:#bd8b28; --sand:#d8bd7b; --muted:#695f52; }
    * { box-sizing:border-box; }

    .hero { position:relative; overflow:hidden; padding:5rem 1.25rem 4.4rem; text-align:center; color:#fff9e6; background:linear-gradient(118deg,var(--deep),var(--blue)); border-bottom:6px solid var(--gold); }
    .hero::before,.hero::after { position:absolute; color:rgb(231 198 104 / .25); font-size:8rem; line-height:1; }
    .hero::before { content:"𓂀"; top:1.2rem; left:max(2rem,8vw); } .hero::after { content:"𓆣"; right:max(2rem,8vw); bottom:-.4rem; }
    .eyebrow { position:relative; margin:0 0 .7rem; color:#e9ca74; font:700 .76rem/1.2 "Trebuchet MS",sans-serif; letter-spacing:.2em; text-transform:uppercase; }
    h1 { position:relative; max-width:800px; margin:0 auto; font-size:clamp(2.5rem,7vw,5rem); font-weight:400; line-height:1; letter-spacing:.02em; }
    .subtitle { position:relative; max-width:610px; margin:1.1rem auto 0; color:#e7ddc4; font-size:1.08rem; line-height:1.55; }
    main { width:min(1160px,calc(100% - 2rem)); margin:2rem auto 4rem; }
    .controls { display:grid; grid-template-columns:1fr 1fr auto; gap:1rem; align-items:end; padding:1.2rem; background:rgb(255 250 240 / .94); border:1px solid rgb(189 139 40 / .7); border-radius:10px; box-shadow:0 10px 25px rgb(48 39 30 / .13); }
    .control-group { display:grid; gap:.45rem; }
    label,.record-count { font:700 .74rem/1.2 "Trebuchet MS",sans-serif; letter-spacing:.1em; text-transform:uppercase; }
    select { width:100%; min-height:2.85rem; padding:.65rem .8rem; color:var(--ink); border:1px solid var(--blue); border-radius:4px; background:#fffdf8; font:1rem "Trebuchet MS",sans-serif; }
    select:focus-visible,button:focus-visible { outline:3px solid #e7c668; outline-offset:2px; }
    .status { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin:1rem .15rem 0; }
    .record-count { margin:0; color:var(--muted); }
    button { min-height:2.85rem; padding:.65rem 1rem; cursor:pointer; color:#fff; border:1px solid var(--deep); border-radius:4px; background:var(--blue); font:700 .78rem "Trebuchet MS",sans-serif; letter-spacing:.06em; text-transform:uppercase; }
    button:hover { background:var(--deep); }
    #content-container { margin-top:1.7rem; }
    .period { margin:0 0 2.5rem; }
    .period-title { display:flex; align-items:center; gap:.8rem; margin:0 0 1rem; color:var(--deep); font-size:clamp(1.5rem,3vw,2.2rem); font-weight:400; }
    .period-title::after { content:""; flex:1; height:1px; background:rgb(23 53 95 / .35); }
    .dynasty { overflow:hidden; margin-bottom:1rem; border:1px solid rgb(189 139 40 / .7); border-radius:8px; background:var(--light); box-shadow:0 3px 9px rgb(48 39 30 / .08); }
    .dynasty-header { display:flex; flex-wrap:wrap; gap:.4rem 1rem; align-items:baseline; padding:.85rem 1.1rem; color:#fff; background:var(--blue); }
    .dynasty-header h3 { margin:0; font-size:1.15rem; font-weight:400; }.dynasty-dates { color:#ead69c; font:.86rem "Trebuchet MS",sans-serif; }
    .rulers { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:1px; background:rgb(189 139 40 / .36); }
    .ruler { padding:1.05rem 1.1rem; background:rgb(255 255 255 / .83); }.ruler:hover { background:#fff; }
    .ruler-name { margin:0; color:var(--deep); font-size:1.08rem; font-weight:700; }.ruler-dates { margin:.35rem 0 .7rem; color:var(--muted); font:.88rem "Trebuchet MS",sans-serif; }.source { margin:0; color:#766b5c; font:italic .76rem/1.4 "Trebuchet MS",sans-serif; }
    .message { margin:3rem auto; padding:1.3rem; max-width:560px; text-align:center; background:rgb(255 250 240 / .9); border:1px solid rgb(189 139 40 / .6); border-radius:8px; font:1rem/1.5 "Trebuchet MS",sans-serif; }.error { color:#782d23; }
    footer { padding:1.5rem 1rem 2.5rem; color:#62594e; text-align:center; font:.82rem/1.5 "Trebuchet MS",sans-serif; }footer a { color:var(--blue); }
    @media (max-width:680px) { .hero { padding:3.7rem 1.25rem 3.4rem; }.hero::before,.hero::after { font-size:5rem; }.controls { grid-template-columns:1fr; }.status { align-items:stretch; flex-direction:column; }.status button { width:100%; } }
  </style>
</head>

    let rulers = localRulers;
    const sheetUrl = "https://docs.google.com/spreadsheets/d/1znHpHKyBoVdH4awPj9-MT24AwxkUOTPk82BbYu-GGKg/gviz/tq?tqx=out:json&sheet=Rulers";
    const periodSelect = document.querySelector("#period-select");
    const dynastySelect = document.querySelector("#dynasty-select");
    const clearButton = document.querySelector("#clear-filters");
    const container = document.querySelector("#content-container");
    const recordCount = document.querySelector("#record-count");
    const unique = values => [...new Set(values)];

    function addOptions(select, values, selected = "all") {
      select.replaceChildren(new Option(select === periodSelect ? "All periods" : "All dynasties", "all"));
      values.forEach(value => select.add(new Option(value, value)));
      select.value = values.includes(selected) ? selected : "all";
    }
    function filteredRulers() {
      return rulers.filter(ruler => (periodSelect.value === "all" || ruler.period === periodSelect.value) && (dynastySelect.value === "all" || ruler.dynasty === dynastySelect.value));
    }
    function refreshDynasties() {
      const previous = dynastySelect.value;
      const period = periodSelect.value;
      addOptions(dynastySelect, unique(rulers.filter(r => period === "all" || r.period === period).map(r => r.dynasty)), previous);
    }
    function render(note = "") {
      const visible = filteredRulers();
      recordCount.textContent = `${visible.length} ruler${visible.length === 1 ? "" : "s"} shown${note}`;
      if (!visible.length) { container.innerHTML = '<p class="message">No rulers match these filters. Try choosing another period or clear the filters.</p>'; return; }
      const fragment = document.createDocumentFragment();
      unique(visible.map(r => r.period)).forEach(period => {
        const section = document.createElement("section"); section.className = "period";
        const heading = document.createElement("h2"); heading.className = "period-title"; heading.textContent = period; section.append(heading);
        const withinPeriod = visible.filter(r => r.period === period);
        unique(withinPeriod.map(r => r.dynasty)).forEach(dynastyName => {
          const dynastyRulers = withinPeriod.filter(r => r.dynasty === dynastyName);
          const dynasty = document.createElement("section"); dynasty.className = "dynasty";
          const header = document.createElement("header"); header.className = "dynasty-header";
          const title = document.createElement("h3"); title.textContent = dynastyName;
          const dates = document.createElement("span"); dates.className = "dynasty-dates"; dates.textContent = dynastyRulers[0].dynastyDates;
          const grid = document.createElement("div"); grid.className = "rulers";
          dynastyRulers.forEach(ruler => { const card = document.createElement("article"); card.className = "ruler"; const name = document.createElement("h4"); name.className = "ruler-name"; name.textContent = ruler.name; const reign = document.createElement("p"); reign.className = "ruler-dates"; reign.textContent = ruler.dates; const source = document.createElement("p"); source.className = "source"; source.textContent = ruler.source; card.append(name,reign,source); grid.append(card); });
          header.append(title,dates); dynasty.append(header,grid); section.append(dynasty);
        }); fragment.append(section);
      }); container.replaceChildren(fragment);
    }
    function update() { refreshDynasties(); render(); }
    periodSelect.addEventListener("change", update);
    dynastySelect.addEventListener("change", render);
    clearButton.addEventListener("click", () => { periodSelect.value = "all"; refreshDynasties(); render(); });
    function initialise(note = "") { addOptions(periodSelect, unique(rulers.map(r => r.period))); refreshDynasties(); render(note); }
    async function loadLiveSheet() {
      try {
        const response = await fetch(`${sheetUrl}&cachebust=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error("Sheet request failed");
        const responseText = await response.text();
        const match = responseText.match(/setResponse\\((.*)\\);?\\s*$/s);
        if (!match) throw new Error("Sheet response could not be read");
        const rows = JSON.parse(match[1]).table.rows.slice(1);
        const sheetRulers = rows.map(row => (row.c || []).map(cell => cell ? cell.v : "")).filter(row => row[0] && row[3]).map(([period, dynasty, dynastyDates, name, dates, source]) => ({ period, dynasty, dynastyDates, name, dates, source }));
        if (!sheetRulers.length) throw new Error("Sheet contained no ruler rows");
        rulers = sheetRulers;
        initialise();
      } catch (error) {
        initialise(" · showing saved copy");
      }
    }
    loadLiveSheet();
  </script>
</body>
</html>
