<body class="dynasty-page">
  <header><a href="index.html">𓋹 Pharaoh Archive</a></header>
  <main>
    <a class="back" href="index.html">← All rulers</a>
    <p id="status" class="status">Loading dynasty guide…</p>
    <section id="content" hidden>
      <div class="hero"><p class="eyebrow" id="period"></p><h1 id="title"></h1><p id="timeframe"></p><p id="overview"></p></div>
      <section class="panel"><div class="grid"><div class="tile"><h2>Key rulers</h2><p id="key-rulers"></p></div><div class="tile"><h2>Major monuments</h2><p id="monuments"></p></div><div class="tile"><h2>Wars & major events</h2><p id="events"></p></div><div class="tile"><h2>Reading the evidence</h2><p id="notes"></p></div></div><p id="source" class="source"></p></section>
      <section class="panel"><h2>Rulers in this dynasty</h2><div id="rulers" class="rulers"></div></section>
    </section>
  </main>
  <footer class="site-footer">
    <a href="index.html">Ancient Egyptian rulers chronology</a> &middot; <a href="about.html">About this project</a> &middot; <a href="youtube.html">YouTube</a>
    <span class="credit">Website created by <a href="https://www.linkedin.com/in/bvdlaan/" target="_blank" rel="noopener author">Barry van der Laan MBA</a></span>
  </footer>
  <script>
    const id="1znHpHKyBoVdH4awPj9-MT24AwxkUOTPk82BbYu-GGKg";
    const dynastyName=new URLSearchParams(location.search).get("dynasty");
    const sheet=name=>`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
    const $=selector=>document.querySelector(selector);
    function parse(text){const match=text.match(/setResponse\((.*)\);?\s*$/s);if(!match)throw new Error("Invalid sheet response");return JSON.parse(match[1]).table.rows.map(row=>(row.c||[]).map(cell=>cell?cell.v:""));}
    function showGuide(row,rulers,isFallback){
      const [period,dynasty,timeframe,overview,key,monuments,events,notes,source]=row;
      document.title=`${dynasty} | Pharaoh Archive`;
      $("#period").textContent=period;$("#title").textContent=dynasty;$("#timeframe").textContent=timeframe;$("#overview").textContent=overview;$("#key-rulers").textContent=key;$("#monuments").textContent=monuments;$("#events").textContent=events;$("#notes").textContent=notes;$("#source").textContent=isFallback?"This basic guide is generated from the Rulers sheet; a fuller dynasty overview can be added to the Dynasties sheet.":`Sources: ${source}`;
      rulers.forEach(item=>{const card=document.createElement("article");card.className="ruler";const link=document.createElement("a");link.href=`encyclopedia.html?ruler=${encodeURIComponent(item[3])}`;link.textContent=item[3];const date=document.createElement("p");date.textContent=item[4]||"Date uncertain";card.append(link,date);$("#rulers").append(card);});
      $("#status").hidden=true;$("#content").hidden=false;
    }
    async function load(){
      if(!dynastyName){$("#status").textContent="Choose a dynasty from the Dynasty or ruling house menu on the chronology, then select “Open selected dynasty guide”.";return;}
      try{
        const rulersResponse=await fetch(sheet("Rulers"),{cache:"no-store"});if(!rulersResponse.ok)throw new Error("Rulers unavailable");
        const allRulers=parse(await rulersResponse.text());
        const rulers=allRulers.filter(row=>row[1]===dynastyName&&row[3]&&row[3]!=="Ruler name");if(!rulers.length)throw new Error("Dynasty unavailable");
        let guideRows=[];try{const guideResponse=await fetch(sheet("Dynasties"),{cache:"no-store"});if(guideResponse.ok)guideRows=parse(await guideResponse.text());}catch{}
        const guide=guideRows.find(row=>row[1]===dynastyName);
        const first=rulers[0];
        const fallback=[first[0],dynastyName,first[2],`This guide is generated from the ruler records for ${dynastyName}. A dedicated overview with dynasty highlights is still being prepared.`,rulers.slice(0,6).map(row=>row[3]).join("; "),"See individual ruler entries for monument evidence.","See individual ruler entries for campaign and event evidence.","Chronology and attribution can be debated; consult each ruler's cited sources.",""];
        showGuide(guide||fallback,rulers,!guide);
      }catch{$("#status").textContent="This dynasty guide could not be loaded. Please return to the chronology and try again.";}
    }
    load();
  </script>
</body>
